<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Egocentric Video Review Logger</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'media' };</script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen py-6 px-4 font-sans transition-colors duration-200">

  <div class="max-w-4xl mx-auto bg-white dark:bg-slate-800 p-6 md:p-8 rounded-xl shadow-md border border-slate-200 dark:border-slate-700">
    <h1 class="text-2xl font-bold text-slate-800 dark:text-white mb-2">Egocentric Video Review Logger</h1>
    <p class="text-slate-600 dark:text-slate-400 mb-6 text-sm">Log review feedback, timestamp failed segments, and record final video quality grades.</p>

    <!-- LOOKUP EXISTING REVIEW / START NEW -->
    <div class="bg-blue-50 dark:bg-slate-900/80 p-4 rounded-lg border border-blue-200 dark:border-slate-700 mb-6 space-y-2">
      <h2 class="text-xs font-bold uppercase tracking-wider text-blue-800 dark:text-blue-300">Retrieve Existing Review</h2>
      <div class="flex flex-col sm:flex-row gap-2">
        <input type="text" id="lookupReviewId" placeholder="Enter Review ID (e.g., REV12345)"
          class="flex-1 p-2.5 text-sm border rounded-lg bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-600 uppercase font-mono outline-none focus:ring-2 focus:ring-blue-500" />
        <button type="button" onclick="fetchReviewData()" id="lookupBtn"
          class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2.5 rounded-lg text-sm transition disabled:opacity-50">Load Review</button>
        <button type="button" onclick="resetForm()" id="newReviewBtn"
          class="bg-slate-600 hover:bg-slate-700 text-white font-semibold px-4 py-2.5 rounded-lg text-sm transition">Start New Review</button>
      </div>
      <p id="lookupStatus" class="text-xs text-slate-500 dark:text-slate-400"></p>
    </div>

    <form id="reviewForm" class="space-y-6">

      <div class="flex justify-between items-center text-xs font-mono font-semibold text-slate-500 dark:text-slate-400">
        <span>ACTIVE REVIEW ID: <strong id="currentReviewIdDisplay" class="text-blue-600 dark:text-blue-400">NEW SUBMISSION</strong></span>
        <input type="hidden" id="reviewId" name="reviewId" value="">
      </div>

      <div class="bg-slate-50 dark:bg-slate-900/50 p-4 rounded-lg border border-slate-200 dark:border-slate-700 space-y-4">
        <h2 class="text-lg font-semibold text-slate-700 dark:text-slate-200 border-b border-slate-200 dark:border-slate-700 pb-2">Session Overview</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase mb-1 text-slate-700 dark:text-slate-300">1. Reviewer ID *</label>
            <select id="reviewerId" required class="w-full p-2.5 text-sm border rounded-lg bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-600 focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="">Choose Reviewer ID...</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase mb-1 text-slate-700 dark:text-slate-300">2. Team Member ID *</label>
            <select id="teamMemberId" required class="w-full p-2.5 text-sm border rounded-lg bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-600 focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="">Choose Team Member ID...</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase mb-1 text-slate-700 dark:text-slate-300">3. Type of Activity *</label>
            <select id="activityType" required class="w-full p-2.5 text-sm border rounded-lg bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-600 focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="">Choose Activity Type...</option>
              <option value="Residential">Residential</option>
              <option value="Commercial">Commercial</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase mb-1 text-slate-700 dark:text-slate-300">4. Select Task *</label>
            <select id="taskSelect" disabled required class="w-full p-2.5 text-sm border rounded-lg bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-600 focus:ring-2 focus:ring-blue-500 outline-none disabled:opacity-50">
              <option value="">Select Activity Type First...</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase mb-1 text-slate-700 dark:text-slate-300">5. Total Number of Video Clips Submitted</label>
            <input type="text" id="totalVideoCount" value="0" readonly class="w-full p-2.5 text-sm font-bold bg-slate-200 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-slate-700 dark:text-slate-200 cursor-not-allowed">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase mb-1 text-slate-700 dark:text-slate-300">6. Total Length of Task (HH:MM:SS)</label>
            <input type="text" id="totalTaskLength" name="totalTaskLength" readonly value="00:00:00" class="w-full p-2.5 text-sm font-mono font-bold bg-slate-200 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-slate-700 dark:text-slate-200 cursor-not-allowed">
          </div>
        </div>
      </div>

      <div class="space-y-4">
        <h2 class="text-lg font-semibold text-slate-700 dark:text-slate-200">Video Reviews</h2>
        <div id="videoContainer" class="space-y-6"></div>
        <div class="pt-2">
          <button type="button" onclick="addVideoCard(); markDirty();" class="w-full bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-800 dark:text-slate-100 font-semibold py-2.5 px-4 rounded-lg border border-slate-300 dark:border-slate-600 transition flex items-center justify-center gap-2">
            <span>+</span> Add Video Card
          </button>
        </div>
      </div>

      <div class="pt-4 border-t border-slate-200 dark:border-slate-700">
        <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg shadow transition disabled:opacity-50">
          Submit Review
        </button>
      </div>
    </form>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzsn9sz_WGXfZeb_FEYwNhkBUBDb7ND48eXiEy_WcydO42Tk3qHpdEwfrcrnqJiOtvr/exec';
    const AUTOSAVE_KEY = 'review_form_autosave';

    let isFormDirty = false;
    let isSubmitting = false;
    let videoCount = 0;

    const reviewerSelect = document.getElementById('reviewerId');
    const teamSelect = document.getElementById('teamMemberId');
    const activitySelect = document.getElementById('activityType');
    const taskSelect = document.getElementById('taskSelect');
    const reviewForm = document.getElementById('reviewForm');

    // ---------- Dropdown options ----------
    ['TTA003', 'TTA005', 'TTA007', 'TTA024', 'TTA036', 'TTA077', 'TTA088', 'TTA100']
      .forEach(id => reviewerSelect.add(new Option(id, id)));
    for (let i = 1; i <= 100; i++) {
      const id = `TTA${String(i).padStart(3, '0')}`;
      teamSelect.add(new Option(id, id));
    }

    activitySelect.addEventListener('change', function () { loadTaskOptions(this.value); });

    function loadTaskOptions(type, targetValue = '') {
      taskSelect.innerHTML = '<option value="">Loading tasks...</option>';
      taskSelect.disabled = true;

      if (!type) {
        taskSelect.innerHTML = '<option value="">Select Activity Type First...</option>';
        return Promise.resolve();
      }

      const file = type === 'Residential' ? 'residential_tasks.json' : 'commercial_tasks.json';
      return fetch(file)
        .then(res => {
          if (!res.ok) throw new Error('File not found');
          return res.json();
        })
        .then(tasks => {
          taskSelect.innerHTML = '<option value="">Choose Task...</option>';
          tasks.forEach(t => taskSelect.add(new Option(t, t)));
          taskSelect.disabled = false;
          if (targetValue) setSelectValue(taskSelect, targetValue);
        })
        .catch(err => {
          console.error('Task loading error:', err);
          taskSelect.innerHTML = '<option value="">Error loading task file</option>';
          // Still show the stored task so loaded data is not lost
          if (targetValue) {
            setSelectValue(taskSelect, targetValue);
            taskSelect.disabled = false;
          }
        });
    }

    function setSelectValue(sel, value) {
      value = value || '';
      if (value && !Array.from(sel.options).some(o => o.value === value)) {
        sel.add(new Option(value, value));
      }
      sel.value = value;
    }

    // ---------- Time helpers ----------
    function timeToSeconds(timeStr) {
      if (!timeStr) return 0;
      const parts = timeStr.trim().split(':').map(Number);
      if (parts.some(isNaN)) return 0;
      if (parts.length === 2) return parts[0] * 60 + parts[1];
      if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      return 0;
    }

    function secondsToFormattedTime(totalSeconds) {
      const pad = n => String(n).padStart(2, '0');
      return `${pad(Math.floor(totalSeconds / 3600))}:${pad(Math.floor((totalSeconds % 3600) / 60))}:${pad(totalSeconds % 60)}`;
    }

    function updateTotalTaskLength() {
      let total = 0;
      document.querySelectorAll('.video-card input[name="videoLength"]').forEach(i => { total += timeToSeconds(i.value); });
      document.getElementById('totalTaskLength').value = secondsToFormattedTime(total);
      triggerAutosave();
    }

    // ---------- Dirty tracking ----------
    function markDirty() {
      isFormDirty = true;
      triggerAutosave();
    }

    window.addEventListener('beforeunload', e => {
      if (isFormDirty && !isSubmitting) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    reviewForm.addEventListener('input', markDirty);
    reviewForm.addEventListener('change', markDirty);

    // ---------- Review ID ----------
    function generateReviewId() {
      return `REV${Math.floor(10000 + Math.random() * 90000)}`;
    }

    function setReviewId(id) {
      document.getElementById('reviewId').value = id;
      document.getElementById('currentReviewIdDisplay').textContent = id || 'NEW SUBMISSION';
    }

    // ---------- Video / segment cards ----------
    function addVideoCard() {
      videoCount++;
      const card = document.createElement('div');
      card.className = 'video-card bg-slate-50 dark:bg-slate-900/50 p-5 rounded-lg border-2 border-slate-200 dark:border-slate-700 space-y-4 relative';
      card.innerHTML = `
        <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-700 pb-2">
          <span class="video-card-title font-bold text-md text-slate-800 dark:text-slate-100">Video Clip #${videoCount}</span>
          <button type="button" onclick="removeVideoCard(this)" class="remove-btn text-red-500 text-xs font-semibold hover:underline">Delete Video Card</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400">Video Clip Title *</label>
            <input type="text" name="videoTitle" placeholder="e.g. Video-1 Title" required class="w-full p-2 text-sm border rounded bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-600">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400">Video Clip Length (e.g. 05:30) *</label>
            <input type="text" name="videoLength" placeholder="MM:SS" required class="w-full p-2 text-sm border rounded bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-600">
          </div>
        </div>
        <div class="space-y-3 pt-2">
          <span class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Failed Portions / Segments</span>
          <div class="segment-container space-y-3"></div>
          <div>
            <button type="button" onclick="addSegmentCard(this); markDirty();" class="w-full py-2 text-xs bg-red-50 text-red-700 dark:bg-red-900/30 dark:text-red-300 hover:bg-red-100 dark:hover:bg-red-900/50 border border-red-200 dark:border-red-800/50 rounded-lg font-semibold transition flex items-center justify-center gap-1">
              <span>+</span> Add Failed Segment
            </button>
          </div>
        </div>
        <div class="pt-2 border-t border-slate-200 dark:border-slate-700">
          <label class="block text-xs font-bold uppercase mb-1 text-slate-600 dark:text-slate-400">Final Review Notes / Feedback for Video Clip</label>
          <textarea name="finalReviewNotes" rows="2" placeholder="Enter final review notes or overall feedback for this clip..." class="w-full p-2.5 text-xs border rounded bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-600 text-slate-800 dark:text-slate-100 outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-3 border-t border-slate-200 dark:border-slate-700">
          <div>
            <label class="block text-xs font-bold uppercase mb-1.5 text-slate-600 dark:text-slate-400">Final Verdict *</label>
            <input type="hidden" name="finalVerdict">
            <div class="flex gap-2">
              <button type="button" onclick="setVerdict(this, 'Approved')" class="verdict-btn flex-1 py-2 text-xs font-bold rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 hover:bg-emerald-50 dark:hover:bg-emerald-950 transition">Approved</button>
              <button type="button" onclick="setVerdict(this, 'Rejected')" class="verdict-btn flex-1 py-2 text-xs font-bold rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 hover:bg-red-50 dark:hover:bg-red-950 transition">Rejected</button>
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase mb-1.5 text-slate-600 dark:text-slate-400">Overall Grade *</label>
            <input type="hidden" name="overallGrade">
            <div class="flex gap-1.5">
              <button type="button" onclick="setGrade(this, 'B')" class="grade-btn flex-1 py-2 text-xs font-bold rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 hover:bg-blue-50 dark:hover:bg-blue-950 transition">Brilliant</button>
              <button type="button" onclick="setGrade(this, 'G')" class="grade-btn flex-1 py-2 text-xs font-bold rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 hover:bg-blue-50 dark:hover:bg-blue-950 transition">Good</button>
              <button type="button" onclick="setGrade(this, 'A')" class="grade-btn flex-1 py-2 text-xs font-bold rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 hover:bg-blue-50 dark:hover:bg-blue-950 transition">Acceptable</button>
              <button type="button" onclick="setGrade(this, 'P')" class="grade-btn flex-1 py-2 text-xs font-bold rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 hover:bg-blue-50 dark:hover:bg-blue-950 transition">Poor</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('videoContainer').appendChild(card);
      card.querySelector('input[name="videoLength"]').addEventListener('input', updateTotalTaskLength);
      reindexVideoCards();
      return card;
    }

    function removeVideoCard(btn) {
      const card = btn.closest('.video-card');
      if (card) {
        card.remove();
        reindexVideoCards();
        updateTotalTaskLength();
        markDirty();
      }
    }

    function reindexVideoCards() {
      const cards = document.querySelectorAll('.video-card');
      document.getElementById('totalVideoCount').value = cards.length;
      cards.forEach((card, index) => {
        card.querySelector('.video-card-title').textContent = `Video Clip #${index + 1}`;
        card.querySelector('.remove-btn').style.display = cards.length === 1 ? 'none' : 'inline-block';
      });
      videoCount = cards.length;
    }

    function addSegmentCard(btnOrContainer) {
      const segContainer = btnOrContainer.classList && btnOrContainer.classList.contains('segment-container')
        ? btnOrContainer
        : btnOrContainer.closest('.video-card').querySelector('.segment-container');

      const segCard = document.createElement('div');
      segCard.className = 'segment-card bg-white dark:bg-slate-800 p-3 rounded border border-slate-200 dark:border-slate-700 space-y-2';
      segCard.innerHTML = `
        <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-1">
          <span class="segment-title text-xs font-bold text-red-600 dark:text-red-400">Failed Segment #${segContainer.children.length + 1}</span>
          <button type="button" onclick="removeSegmentCard(this)" class="text-red-500 text-xs hover:underline">Remove</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
          <input type="text" name="startTime" placeholder="Start Time (e.g. 01:05)" class="p-2 text-xs border rounded bg-slate-50 dark:bg-slate-900 border-slate-300 dark:border-slate-600">
          <input type="text" name="finishTime" placeholder="Finish Time (e.g. 02:50)" class="p-2 text-xs border rounded bg-slate-50 dark:bg-slate-900 border-slate-300 dark:border-slate-600">
        </div>
        <input type="text" name="remark" placeholder="Reviewer remark for failure..." class="w-full p-2 text-xs border rounded bg-slate-50 dark:bg-slate-900 border-slate-300 dark:border-slate-600">
      `;
      segContainer.appendChild(segCard);
      return segCard;
    }

    function removeSegmentCard(btn) {
      const segContainer = btn.closest('.segment-container');
      btn.closest('.segment-card').remove();
      segContainer.querySelectorAll('.segment-card').forEach((seg, idx) => {
        seg.querySelector('.segment-title').textContent = `Failed Segment #${idx + 1}`;
      });
      markDirty();
    }

    function setVerdict(btn, value) {
      const parent = btn.closest('div');
      parent.querySelectorAll('.verdict-btn').forEach(b => {
        b.classList.remove('bg-emerald-600', 'text-white', 'bg-red-600', 'border-transparent');
        b.classList.add('bg-white', 'dark:bg-slate-800');
      });
      btn.classList.remove('bg-white', 'dark:bg-slate-800');
      btn.classList.add(value === 'Approved' ? 'bg-emerald-600' : 'bg-red-600', 'text-white', 'border-transparent');
      parent.parentElement.querySelector('input[name="finalVerdict"]').value = value;
      markDirty();
    }

    function setGrade(btn, value) {
      const parent = btn.closest('div');
      parent.querySelectorAll('.grade-btn').forEach(b => {
        b.classList.remove('bg-blue-600', 'text-white', 'border-transparent');
        b.classList.add('bg-white', 'dark:bg-slate-800');
      });
      btn.classList.remove('bg-white', 'dark:bg-slate-800');
      btn.classList.add('bg-blue-600', 'text-white', 'border-transparent');
      parent.parentElement.querySelector('input[name="overallGrade"]').value = value;
      markDirty();
    }

    // ---------- Collect / autosave ----------
    function collectVideos() {
      return Array.from(document.querySelectorAll('.video-card')).map(card => ({
        title: card.querySelector('[name="videoTitle"]').value,
        length: card.querySelector('[name="videoLength"]').value,
        notes: card.querySelector('[name="finalReviewNotes"]').value,
        verdict: card.querySelector('input[name="finalVerdict"]').value,
        grade: card.querySelector('input[name="overallGrade"]').value,
        failedSegments: Array.from(card.querySelectorAll('.segment-card')).map(s => ({
          startTime: s.querySelector('[name="startTime"]').value,
          finishTime: s.querySelector('[name="finishTime"]').value,
          remark: s.querySelector('[name="remark"]').value
        }))
      }));
    }

    function serializeFormState() {
      return {
        reviewId: document.getElementById('reviewId').value,
        reviewerId: reviewerSelect.value,
        teamMemberId: teamSelect.value,
        activityType: activitySelect.value,
        selectedTask: taskSelect.value,
        videos: collectVideos()
      };
    }

    function triggerAutosave() {
      if (isSubmitting) return;
      try { localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(serializeFormState())); } catch (e) { /* storage unavailable */ }
    }

    // ---------- Populate form (from sheet or autosave) ----------
    function normalizeGrade(g) {
      const map = { b: 'B', brilliant: 'B', g: 'G', good: 'G', a: 'A', acceptable: 'A', p: 'P', poor: 'P' };
      return map[String(g || '').trim().toLowerCase()] || '';
    }

    function normalizeVerdict(v) {
      const s = String(v || '').trim().toLowerCase();
      if (s.startsWith('appr')) return 'Approved';
      if (s.startsWith('rej')) return 'Rejected';
      return '';
    }

    function populateFormFromData(data) {
      setReviewId(data.reviewId || '');
      setSelectValue(reviewerSelect, data.reviewerId);
      setSelectValue(teamSelect, data.teamMemberId);
      setSelectValue(activitySelect, data.activityType);

      return loadTaskOptions(data.activityType, data.selectedTask).then(() => {
        document.getElementById('videoContainer').innerHTML = '';
        videoCount = 0;

        if (data.videos && data.videos.length > 0) {
          const gradeLabels = { B: 'Brilliant', G: 'Good', A: 'Acceptable', P: 'Poor' };

          data.videos.forEach(v => {
            const card = addVideoCard();
            card.querySelector('[name="videoTitle"]').value = v.title || '';
            card.querySelector('[name="videoLength"]').value = v.length || '';
            card.querySelector('[name="finalReviewNotes"]').value = v.notes || '';

            const verdict = normalizeVerdict(v.verdict);
            if (verdict) {
              const vBtn = Array.from(card.querySelectorAll('.verdict-btn')).find(b => b.textContent.trim() === verdict);
              if (vBtn) setVerdict(vBtn, verdict);
            }

            const grade = normalizeGrade(v.grade);
            if (grade) {
              const gBtn = Array.from(card.querySelectorAll('.grade-btn')).find(b => b.textContent.trim() === gradeLabels[grade]);
              if (gBtn) setGrade(gBtn, grade);
            }

            const segContainer = card.querySelector('.segment-container');
            (v.failedSegments || []).forEach(seg => {
              const segCard = addSegmentCard(segContainer);
              segCard.querySelector('[name="startTime"]').value = seg.startTime || '';
              segCard.querySelector('[name="finishTime"]').value = seg.finishTime || '';
              segCard.querySelector('[name="remark"]').value = seg.remark || '';
            });
          });
        } else {
          addVideoCard();
        }

        reindexVideoCards();
        updateTotalTaskLength();
        isFormDirty = false; // loading is not an unsaved edit
      });
    }

    function restoreAutosave() {
      const saved = localStorage.getItem(AUTOSAVE_KEY);
      if (saved) {
        try {
          populateFormFromData(JSON.parse(saved));
          return;
        } catch (e) {
          console.error('Could not parse autosave state', e);
        }
      }
      addVideoCard();
    }

    // ---------- Retrieve review from Apps Script ----------
    function fetchReviewData() {
      const id = document.getElementById('lookupReviewId').value.trim().toUpperCase();
      const statusEl = document.getElementById('lookupStatus');
      const lookupBtn = document.getElementById('lookupBtn');

      if (!id) {
        statusEl.textContent = 'Please enter a valid Review ID.';
        statusEl.className = 'text-xs text-red-500';
        return;
      }

      lookupBtn.disabled = true;
      statusEl.textContent = 'Fetching review data...';
      statusEl.className = 'text-xs text-blue-500';

      fetch(`${SCRIPT_URL}?reviewId=${encodeURIComponent(id)}`)
        .then(res => res.json())
        .then(res => {
          if (res.status === 'success' && res.data) {
            return populateFormFromData(res.data).then(() => {
              statusEl.textContent = `Review ${id} loaded successfully! Edit and resubmit to update it.`;
              statusEl.className = 'text-xs text-emerald-600 font-semibold';
              isFormDirty = false;
            });
          }
          statusEl.textContent = res.message || 'Review ID not found.';
          statusEl.className = 'text-xs text-red-500';
        })
        .catch(err => {
          statusEl.textContent = 'Error loading review: ' + err.message;
          statusEl.className = 'text-xs text-red-500';
        })
        .finally(() => {
          lookupBtn.disabled = false;
        });
    }

    // ---------- Clear form / start a new review ----------
    function resetForm() {
      if (isFormDirty && !confirm('Clear the entire form and start a new review? Unsaved changes will be lost.')) return;

      setReviewId('');
      reviewerSelect.value = '';
      teamSelect.value = '';
      activitySelect.value = '';
      taskSelect.innerHTML = '<option value="">Select Activity Type First...</option>';
      taskSelect.disabled = true;

      document.getElementById('videoContainer').innerHTML = '';
      videoCount = 0;
      addVideoCard();
      updateTotalTaskLength();

      document.getElementById('lookupReviewId').value = '';
      const statusEl = document.getElementById('lookupStatus');
      statusEl.textContent = 'Form cleared. You are starting a new review.';
      statusEl.className = 'text-xs text-slate-500 dark:text-slate-400';

      localStorage.removeItem(AUTOSAVE_KEY);
      isFormDirty = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ---------- Submit ----------
    reviewForm.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!confirm('Are you sure you want to submit this review?')) return;

      let valid = true;
      document.querySelectorAll('.video-card').forEach((card, idx) => {
        if (!card.querySelector('input[name="finalVerdict"]').value || !card.querySelector('input[name="overallGrade"]').value) {
          alert(`Please select both Verdict and Grade for Video Clip #${idx + 1}`);
          valid = false;
        }
      });
      if (!valid) return;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Submitting Review...';
      isSubmitting = true;

      let activeReviewId = document.getElementById('reviewId').value;
      if (!activeReviewId) {
        activeReviewId = generateReviewId();
        setReviewId(activeReviewId);
      }

      const commonInfo = {
        reviewId: activeReviewId,
        reviewerId: reviewerSelect.value,
        teamMemberId: teamSelect.value,
        activityType: activitySelect.value,
        selectedTask: taskSelect.value,
        totalVideos: document.getElementById('totalVideoCount').value,
        totalTaskLength: document.getElementById('totalTaskLength').value || '00:00:00'
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ commonInfo, videos: collectVideos() })
      })
        .then(res => res.json())
        .then(res => {
          if (res.status === 'success') {
            alert(`Review ${activeReviewId} submitted successfully!`);
            localStorage.removeItem(AUTOSAVE_KEY);
            isFormDirty = false;
            location.reload();
          } else {
            throw new Error(res.message || 'Submission failed.');
          }
        })
        .catch(err => {
          alert('Error submitting review: ' + err.message);
          btn.disabled = false;
          btn.textContent = 'Submit Review';
          isSubmitting = false;
        });
    });

    // ---------- Init ----------
    restoreAutosave();
  </script>
</body>
</html>
